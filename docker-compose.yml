services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-secure-assistant
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: securedocs-api:1.0.0
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans le fichier .env}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    image: securedocs-frontend:1.0.0
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped